name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON config
        run: python -m json.tool .github/profile-readme.config.json

      - name: Compile Python
        run: python -m py_compile scripts/update_profile_readme.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
